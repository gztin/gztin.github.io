<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Dashboard</title>
  <link rel="stylesheet" href="https://impeccable.style/downloads/impeccable.min.css" />
  <style>
    :root { --bg:#0f1320; --panel:#151c2b; --line:#2a3550; --text:#f5f7fa; --muted:#99a7c2; --ok:#39d98a; --bad:#ff6b6b; --accent:#4da3ff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:radial-gradient(1200px 500px at 20% -10%, #1b2740 0%, var(--bg) 55%); font-family:"Segoe UI","Noto Sans TC",sans-serif; }
    .wrap { max-width:1260px; margin:0 auto; padding:20px; }
    h1 { margin:0; font-size:24px; }
    .sub { color:var(--muted); }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 14px; }
    .chip { border:1px solid var(--line); background:#111a2b; color:var(--text); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
    .chip.active { border-color:var(--accent); background:#152742; }
    .group { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    label { color:var(--muted); font-size:14px; }
    select { margin-left:6px; padding:7px 10px; background:#111a2b; color:var(--text); border:1px solid var(--line); border-radius:8px; min-height:40px; }
    .meta { margin-left:auto; white-space:nowrap; }
    .card { background:linear-gradient(180deg, #171f31 0%, #141a28 100%); border:1px solid var(--line); border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.22); margin-bottom:14px; }
    .card h2 { margin:0 0 10px; font-size:18px; }
    table { width:100%; border-collapse:collapse; font-size:15px; }
    th, td { border-bottom:1px solid var(--line); padding:11px 8px; }
    th { color:var(--muted); text-align:left; }
    #entryTable th:nth-child(1), #entryTable td:nth-child(1) { width:33.33%; text-align:left; }
    #entryTable th:nth-child(2), #entryTable td:nth-child(2) { width:33.33%; text-align:center; }
    #entryTable th:nth-child(3), #entryTable td:nth-child(3) { width:33.33%; text-align:right; }
    .mono { font-family:Consolas,"Courier New",monospace; }
    .ok { color:var(--ok); }
    .bad { color:var(--bad); }
    tbody tr:hover { background:rgba(77,163,255,.08); }
    .stats-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .stat { border:1px solid var(--line); border-radius:10px; background:#10192a; padding:12px; }
    .stat-title { color:var(--muted); font-size:13px; margin-bottom:4px; }
    .stat-rate { font-size:24px; font-weight:700; }
    .stat-meta { color:var(--muted); font-size:13px; margin-top:4px; }
    @media (max-width:900px) {
      .meta { width:100%; margin-left:0; }
      .stats-grid { grid-template-columns:1fr; }
    }
    @media (max-width:640px) {
      .wrap { padding:14px; }
      h1 { font-size:20px; }
      .toolbar { gap:8px; }
      .group { width:100%; }
      .group:first-child { justify-content:space-between; }
      .group:first-child .chip { flex:1 1 calc(25% - 6px); text-align:center; padding:8px 0; }
      .group:nth-child(2) label { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .group:nth-child(2) select { width:58%; margin-left:0; }
      .meta { font-size:13px; line-height:1.35; }
      .card { padding:10px; border-radius:9px; }
      .card h2 { font-size:16px; }
      table { font-size:13px; }
      th, td { padding:9px 6px; }
      #entryTable th:nth-child(1), #entryTable td:nth-child(1) { width:40%; }
      #entryTable th:nth-child(2), #entryTable td:nth-child(2) { width:25%; }
      #entryTable th:nth-child(3), #entryTable td:nth-child(3) { width:35%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Signal Dashboard</h1>
    <div class="card">
      <h2>統計資訊 (60m)</h2>
      <div class="stats-grid" id="starCards"></div>
    </div>
    <div class="toolbar">
      <div class="group">
        <button class="chip active" data-tf="15m">15m</button>
        <button class="chip" data-tf="30m">30m</button>
        <button class="chip" data-tf="1h">1h</button>
        <button class="chip" data-tf="4h">4h</button>
      </div>
      <div class="group">
        <label>是否達標<select id="statusFilter"><option value="pass" selected>達標</option><option value="fail">未達標</option><option value="pending">評估中</option><option value="all">全顯示</option></select></label>
        <label>星等<select id="starFilter"><option value="all" selected>全顯示</option><option value="1">⭐</option><option value="2">⭐⭐</option><option value="3">⭐⭐⭐</option></select></label>
        <label>型態<select id="typeFilter"><option value="all" selected>全顯示</option></select></label>
      </div>
      <div class="meta sub" id="meta">Loading...</div>
    </div>

    <div class="card">
      <h2>信號明細</h2>
      <table id="entryTable">
        <thead><tr><th>幣種</th><th>漲跌幅</th><th>推送時間</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const DEFAULT_TIMEZONE = "Asia/Taipei";
    const state = { tf: "15m", data: null, status: "pass", star: "all", type: "all" };
    const chips = Array.from(document.querySelectorAll(".chip"));
    const statusFilter = document.getElementById("statusFilter");
    const starFilter = document.getElementById("starFilter");
    const typeFilter = document.getElementById("typeFilter");

    chips.forEach((chip) => chip.addEventListener("click", () => {
      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      state.tf = chip.dataset.tf;
      render();
    }));
    statusFilter.addEventListener("change", () => { state.status = statusFilter.value; render(); });
    starFilter.addEventListener("change", () => { state.star = starFilter.value; render(); });
    typeFilter.addEventListener("change", () => { state.type = typeFilter.value; render(); });

    function formatTaipei(ts) { return new Date(ts).toLocaleString("zh-TW", { timeZone: DEFAULT_TIMEZONE, hour12: false }); }
    function evalForTf(entry) { return (entry.evaluations || {})[state.tf] || null; }
    function changePct(entry) { const r = evalForTf(entry); return r && typeof r.pnlPct === "number" ? r.pnlPct : 0; }
    function statusKey(entry) { const r = evalForTf(entry); if (!r) return "pending"; return r.win ? "pass" : "fail"; }

    function summarizeStarRate60m(entries) {
      const base = new Map([[1, { stars:1, total:0, evaluated:0, wins:0 }],[2, { stars:2, total:0, evaluated:0, wins:0 }],[3, { stars:3, total:0, evaluated:0, wins:0 }]]);
      entries.forEach((entry) => {
        const stars = Math.max(1, Math.min(3, Number(entry.stars || 1)));
        const row = base.get(stars);
        row.total += 1;
        const r = (entry.evaluations || {})["1h"] || null;
        if (!r || typeof r.win !== "boolean") return;
        row.evaluated += 1;
        if (r.win) row.wins += 1;
      });
      return [1,2,3].map(k => base.get(k));
    }

    function renderEntries(entries) {
      const tbody = document.querySelector("#entryTable tbody");
      const sorted = entries.slice().sort((a, b) => b.timestamp - a.timestamp).slice(0, 300);
      tbody.innerHTML = sorted.length ? sorted.map((e) => {
        const p = changePct(e);
        const cls = p >= 0 ? "ok" : "bad";
        const arrow = p >= 0 ? "▲" : "▼";
        return `<tr><td class="mono">${e.symbol}</td><td class="${cls}">${arrow} ${Math.abs(p).toFixed(2)}%</td><td>${formatTaipei(e.timestamp)}</td></tr>`;
      }).join("") : `<tr><td colspan="3">無資料</td></tr>`;
    }

    function renderStarCards(rows) {
      const el = document.getElementById("starCards");
      el.innerHTML = rows.map((r) => {
        const rate = r.evaluated ? ((r.wins / r.evaluated) * 100).toFixed(2) : "0.00";
        return `<div class="stat"><div class="stat-title">${"⭐".repeat(r.stars)}</div><div class="stat-rate">${rate}%</div><div class="stat-meta">已評估 ${r.evaluated} / 推送 ${r.total}</div></div>`;
      }).join("");
    }

    function render() {
      if (!state.data) return;
      const entries = state.data.entries || [];
      const allTypes = Array.from(new Set(entries.map(e => e.signalType || "-"))).sort((a, b) => a.localeCompare(b, "zh-Hant"));
      const cur = state.type;
      typeFilter.innerHTML = `<option value="all">全顯示</option>` + allTypes.map(t => `<option value="${t}">${t}</option>`).join("");
      if (allTypes.includes(cur)) typeFilter.value = cur; else { state.type = "all"; typeFilter.value = "all"; }

      const filteredEntries = entries.filter((e) => {
        if (state.status !== "all" && statusKey(e) !== state.status) return false;
        if (state.star !== "all" && String(e.stars || 1) !== state.star) return false;
        if (state.type !== "all" && (e.signalType || "-") !== state.type) return false;
        return true;
      });
      const statsEntries = entries.filter((e) => {
        if (state.star !== "all" && String(e.stars || 1) !== state.star) return false;
        if (state.type !== "all" && (e.signalType || "-") !== state.type) return false;
        return true;
      });

      const updatedAt = state.data.updatedAt || Date.now();
      document.getElementById("meta").textContent = `更新時間 (台灣 GMT+8): ${formatTaipei(updatedAt)} | TF: ${state.tf}`;
      renderEntries(filteredEntries);
      renderStarCards(summarizeStarRate60m(statsEntries));
    }

    async function loadData() {
      try {
        const res = await fetch("./api/signal_journal.json", { cache: "no-store" });
        if (!res.ok) { document.getElementById("meta").textContent = `資料讀取失敗: HTTP ${res.status}`; return; }
        state.data = await res.json();
        render();
      } catch (err) {
        document.getElementById("meta").textContent = `資料讀取失敗: ${err.message}`;
      }
    }

    loadData();
    setInterval(loadData, 20000);
  </script>
</body>
</html>
