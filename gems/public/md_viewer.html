<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Viewer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #2a3242;
      --text: #f5f7fa;
      --muted: #9da7b8;
      --accent: #3ea6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .toolbar input, .toolbar select, .toolbar button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    .toolbar input {
      min-width: 360px;
      flex: 1 1 360px;
    }
    .toolbar button {
      cursor: pointer;
      border-color: var(--accent);
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .viewer {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 18px;
      line-height: 1.65;
      overflow: auto;
    }
    .viewer h1, .viewer h2, .viewer h3 { line-height: 1.3; }
    .viewer pre {
      background: #0d1320;
      border: 1px solid #22314a;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }
    .viewer code {
      font-family: Consolas, "Courier New", monospace;
    }
    .viewer table {
      border-collapse: collapse;
      width: 100%;
    }
    .viewer th, .viewer td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
    }
    .error {
      color: #ff8b8b;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <select id="quick">
        <option value="README.md">README.md</option>
        <option value="BOT_CHANGELOG.md">BOT_CHANGELOG.md</option>
        <option value="STRUCTURE.md">STRUCTURE.md</option>
        <option value="docs/signal_scoring_and_winrate.md">docs/signal_scoring_and_winrate.md</option>
      </select>
      <input id="path" type="text" placeholder="輸入 md 路徑，例如 docs/signal_scoring_and_winrate.md" />
      <button id="open">開啟</button>
    </div>
    <div class="hint">可用網址參數：<code>?file=README.md</code>。只允許讀取專案內的 <code>.md</code> 檔案。</div>
    <div id="viewer" class="viewer">載入中...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const viewer = document.getElementById("viewer");
    const pathInput = document.getElementById("path");
    const quick = document.getElementById("quick");
    const openBtn = document.getElementById("open");

    function isSafeMdPath(file) {
      if (!file) return false;
      if (!file.toLowerCase().endsWith(".md")) return false;
      if (file.includes("..")) return false;
      if (file.startsWith("/") || file.startsWith("\\")) return false;
      if (/^[a-zA-Z]:/.test(file)) return false;
      return true;
    }

    function getFileFromQuery() {
      const params = new URLSearchParams(location.search);
      return params.get("file");
    }

    function setFileToQuery(file) {
      const params = new URLSearchParams(location.search);
      params.set("file", file);
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
    }

    async function loadMarkdown(file) {
      if (!isSafeMdPath(file)) {
        viewer.innerHTML = `<div class="error">路徑不合法：${file || "(空)"}\n僅允許專案內相對路徑且副檔名為 .md</div>`;
        return;
      }
      try {
        const res = await fetch(`../${file}`, { cache: "no-store" });
        if (!res.ok) {
          viewer.innerHTML = `<div class="error">讀取失敗：${res.status} ${res.statusText}\n檔案：${file}</div>`;
          return;
        }
        const md = await res.text();
        viewer.innerHTML = marked.parse(md);
      } catch (err) {
        viewer.innerHTML = `<div class="error">讀取例外：${err.message}</div>`;
      }
    }

    function openFile(file) {
      pathInput.value = file;
      setFileToQuery(file);
      loadMarkdown(file);
    }

    quick.addEventListener("change", () => openFile(quick.value));
    openBtn.addEventListener("click", () => openFile(pathInput.value.trim()));
    pathInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") openFile(pathInput.value.trim());
    });

    const initial = getFileFromQuery() || "README.md";
    openFile(initial);
  </script>
</body>
</html>
