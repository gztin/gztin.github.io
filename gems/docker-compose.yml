services:
  gems:
    build:
      context: .
      dockerfile: Dockerfile
    image: gems:latest
    container_name: gems
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - DISCORD_WEBHOOK_URL_STAR_1=${DISCORD_WEBHOOK_URL_STAR_1}
      - DISCORD_WEBHOOK_URL_STAR_2=${DISCORD_WEBHOOK_URL_STAR_2}
      - DISCORD_WEBHOOK_URL_STAR_3=${DISCORD_WEBHOOK_URL_STAR_3}
      - DISCORD_SUMMARY_WEBHOOK_URL=${DISCORD_SUMMARY_WEBHOOK_URL}
    volumes:
      - ./data:/app/data
      - ./src/scripts:/app/src/scripts
      - ./agent:/app/agent
      - ./backtests:/app/backtests
      - ./k_data:/app/k_data
      - ./signals:/app/signals
      - ./public:/app/public
      - ./BOT_CHANGELOG.md:/app/BOT_CHANGELOG.md
      - ./ignoreCommit:/app/ignoreCommit
    network_mode: host
    restart: unless-stopped
